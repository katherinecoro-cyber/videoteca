[server]
# Tamaño máximo de archivo que se puede subir, en MB.
maxUploadSize = 1024

# Colores institucionales de Digital Business School:
# azul oscuro #1E3460, azul #1D70B7, blanco #FFFFFF.
[theme]
base = "light"
primaryColor = "#1D70B7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5FA"
textColor = "#1E3460"
linkColor = "#1D70B7"
borderColor = "#D6DEEA"

[theme.sidebar]
backgroundColor = "#1E3460"
secondaryBackgroundColor = "#2A4478"
textColor = "#FFFFFF"
primaryColor = "#FFFFFF"
borderColor = "#34507F"
