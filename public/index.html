<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoteca de Tutoriales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenido">
      <a class="logo" href="/">Video<span>teca</span></a>
      <a href="/admin.html">Administrar</a>
    </div>
  </header>

  <main class="contenido">
    <h1>Tutoriales</h1>
    <p class="subtitulo">Busca un tema o elige una categoría y haz clic en el video que quieras ver.</p>

    <div class="filtros">
      <input id="buscador" class="buscador" type="search" placeholder="🔍 Buscar tutoriales..." autocomplete="off">
      <div id="categorias" class="chips"></div>
    </div>

    <div id="rejilla" class="rejilla"></div>
    <p id="vacio" class="vacio oculto"></p>
  </main>

  <script src="comun.js"></script>
  <script>
    const buscador = document.getElementById('buscador');
    const contCategorias = document.getElementById('categorias');
    const rejilla = document.getElementById('rejilla');
    const vacio = document.getElementById('vacio');
    let categoriaActual = new URLSearchParams(location.search).get('categoria') || '';

    async function cargarCategorias() {
      const categorias = await pedirJSON('/api/categorias');
      contCategorias.innerHTML = ['', ...categorias].map((c) =>
        `<button class="chip ${c === categoriaActual ? 'activo' : ''}" data-categoria="${escaparHTML(c)}">${c ? escaparHTML(c) : 'Todas'}</button>`
      ).join('');
    }

    async function cargarVideos() {
      const params = new URLSearchParams();
      if (buscador.value.trim()) params.set('q', buscador.value.trim());
      if (categoriaActual) params.set('categoria', categoriaActual);
      const videos = await pedirJSON('/api/videos?' + params);

      rejilla.innerHTML = videos.map((v) => `
        <a class="tarjeta" href="/ver.html?id=${encodeURIComponent(v.id)}">
          ${htmlMiniatura(v)}
          <div class="info">
            <span class="etiqueta">${escaparHTML(v.categoria)}</span>
            <h3>${escaparHTML(v.titulo)}</h3>
            <p>${escaparHTML(v.descripcion)}</p>
          </div>
        </a>`).join('');

      vacio.classList.toggle('oculto', videos.length > 0);
      vacio.textContent = buscador.value || categoriaActual
        ? 'No se encontraron tutoriales con ese criterio.'
        : 'Todavía no hay tutoriales publicados.';
    }

    contCategorias.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      categoriaActual = chip.dataset.categoria;
      contCategorias.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c === chip));
      cargarVideos();
    });

    let espera;
    buscador.addEventListener('input', () => {
      clearTimeout(espera);
      espera = setTimeout(cargarVideos, 250);
    });

    cargarCategorias();
    cargarVideos();
  </script>
</body>
</html>
