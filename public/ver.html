<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver tutorial · Videoteca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenido">
      <a class="logo" href="/">Video<span>teca</span></a>
      <a href="/">← Volver a todos los tutoriales</a>
    </div>
  </header>

  <main class="contenido">
    <div id="vista" class="vista-video oculto">
      <section class="detalle">
        <video id="reproductor" class="reproductor" controls playsinline preload="metadata"></video>
        <h1 id="titulo"></h1>
        <p class="meta"><a id="categoria"></a> · <span id="fecha"></span></p>
        <p id="descripcion" class="descripcion"></p>
      </section>
      <aside>
        <h2>Más de esta categoría</h2>
        <div id="relacionados" class="relacionados"></div>
      </aside>
    </div>
    <p id="error" class="vacio oculto"></p>
  </main>

  <script src="comun.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');

    async function iniciar() {
      try {
        const video = await pedirJSON('/api/videos/' + encodeURIComponent(id));
        document.title = video.titulo + ' · Videoteca';

        const reproductor = document.getElementById('reproductor');
        reproductor.src = '/media/' + encodeURIComponent(video.archivo);
        if (video.miniatura) reproductor.poster = '/media/' + encodeURIComponent(video.miniatura);

        // Recordar en qué minuto se quedó el estudiante.
        const claveProgreso = 'progreso-' + video.id;
        reproductor.addEventListener('loadedmetadata', () => {
          try {
            const t = Number(localStorage.getItem(claveProgreso));
            if (t > 5 && t < reproductor.duration - 5) reproductor.currentTime = t;
          } catch {}
        });
        reproductor.addEventListener('timeupdate', () => {
          try { localStorage.setItem(claveProgreso, Math.floor(reproductor.currentTime)); } catch {}
        });

        document.getElementById('titulo').textContent = video.titulo;
        document.getElementById('descripcion').textContent = video.descripcion;
        document.getElementById('fecha').textContent = formatearFecha(video.fecha);
        const enlaceCategoria = document.getElementById('categoria');
        enlaceCategoria.textContent = video.categoria;
        enlaceCategoria.href = '/?categoria=' + encodeURIComponent(video.categoria);

        const otros = (await pedirJSON('/api/videos?categoria=' + encodeURIComponent(video.categoria)))
          .filter((v) => v.id !== video.id);
        document.getElementById('relacionados').innerHTML = otros.length
          ? otros.map((v) => `
              <a class="relacionado" href="/ver.html?id=${encodeURIComponent(v.id)}">
                ${htmlMiniatura(v)}
                <div><strong>${escaparHTML(v.titulo)}</strong><span class="meta">${formatearFecha(v.fecha)}</span></div>
              </a>`).join('')
          : '<p class="meta">No hay más tutoriales en esta categoría.</p>';

        document.getElementById('vista').classList.remove('oculto');
      } catch (e) {
        const error = document.getElementById('error');
        error.textContent = e.message;
        error.classList.remove('oculto');
      }
    }

    iniciar();
  </script>
</body>
</html>
